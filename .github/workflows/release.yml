name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # must match the CircuitPython version on the pads (boot_out.txt) and the one in firmware.yml
  CIRCUITPYTHON_VERSION: '10.3.1'

jobs:
  firmware:
    # The pad firmware that ships inside every Studio build: Studio updates the pad from this bundle.
    # Compiled once here (the .mpy files are the same on every platform) and given to the builds below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Download mpy-cross for CircuitPython ${{ env.CIRCUITPYTHON_VERSION }}
        run: |
          curl -fsSL -o mpy-cross             "https://adafruit-circuit-python.s3.amazonaws.com/bin/mpy-cross/linux-amd64/mpy-cross-linux-amd64-${CIRCUITPYTHON_VERSION}.static"
          chmod +x mpy-cross
          ./mpy-cross --version | tee version.txt
          grep -q "CircuitPython ${CIRCUITPYTHON_VERSION}" version.txt
      - name: Test the pad's firmware
        run: python -m unittest discover -s Programs/tests
      - name: Build the firmware and its update bundle
        working-directory: Programs
        run: python build_mpy.py --mpy-cross ../mpy-cross
      - name: Test the bundle that was built
        run: python -m unittest discover -s Programs/tests
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-bundle
          path: Programs/build/ota
          if-no-files-found: error

  pad-image:
    # The ready-made .uf2 that sets up a new pad in one step: CircuitPython plus a complete CIRCUITPY drive
    # (Programs/build_uf2.py, which pins everything it downloads). Shipped with the release, next to the installers.
    runs-on: ubuntu-latest
    env:
      MTOOLS_SKIP_CHECK: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: The image pins the same CircuitPython
        run: grep -q "^CIRCUITPYTHON_VERSION = \"${CIRCUITPYTHON_VERSION}\"" Programs/build_uf2.py
      - name: Build the pad image
        working-directory: Programs
        run: |
          name="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/* ]] || name="$(git rev-parse --short HEAD)"
          python build_uf2.py --out "dist/SnekPad-pad-$name.uf2" --fat-out drive.img
      - name: Check the CIRCUITPY drive with other FAT tools
        # build_uf2.py writes the file system itself, so a second opinion: fsck, then copy everything back out
        run: |
          sudo apt-get install -y -q dosfstools mtools
          fsck.fat -n -v Programs/drive.img
          mkdir drive
          mcopy -s -n -i Programs/drive.img "::*" drive/
          cd Programs/build
          find . -type f -not -path './ota/*' | while read -r f; do cmp "$f" "../../drive/$f"; done
          cd ../../drive
          for f in lib/neopixel.mpy lib/adafruit_displayio_ssd1306.mpy lib/adafruit_display_text/label.mpy snekpad32.bmp; do
            test -s "$f" || { echo "missing on the drive: $f"; exit 1; }
          done
          test ! -e dev_tools.mpy && test ! -e nowatchdog && test ! -e config.json
      - uses: actions/upload-artifact@v7
        with:
          name: installer-pad-image   # installer-* so that publish picks it up
          path: Programs/dist/*.uf2
          if-no-files-found: error

  build:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win:setup
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware-bundle
          path: app/resources/firmware
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: The firmware bundle is whole
        run: npm run firmware:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: The production app has no development tools
        # the key test is compiled out unless built with --mode devtools (npm run build:dev)
        shell: bash
        run: |
          for s in "app:keyTest" "Test keys" "silence its keys"; do
            if grep -rqF "$s" out; then
              echo "development tool found in the production bundle: $s"
              exit 1
            fi
          done
      - name: Windows portable zip (the unpacked app, no installer needed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $dir = "dist/SnekPad-Studio-$v"
          Copy-Item dist/win-unpacked $dir -Recurse
          Compress-Archive -Path $dir -DestinationPath "dist/SnekPad-Studio-$v-windows-portable.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/dist/installer/*.exe
            app/dist/*-windows-portable.zip
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, pad-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installer-*   # the installers and the pad image; not the firmware bundle, it is inside the installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" $(find installers -type f) --title "SnekPad $GITHUB_REF_NAME" --notes-file RELEASE_NOTES_$GITHUB_REF_NAME.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
