<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SnekPad Studio Setup</title>
<style>
:root{--bg:#08090b;--surface:#141518;--s2:#25262a;--line:#2e3035;--fg:#dbdee1;--muted:#949ba4;--accent:#5865f2;--ok:#23a55a;--danger:#f23f43}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px 'Segoe UI',system-ui,sans-serif;user-select:none}
.app{display:flex;flex-direction:column;height:100%}
.bar{height:32px;display:flex;justify-content:space-between;align-items:center;padding-left:14px;font-size:12px;color:var(--muted);background:#0c0d10;-webkit-app-region:drag;flex:none}
.bar .btns{display:flex;-webkit-app-region:no-drag}
.bar button{width:46px;height:32px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.bar button:hover{background:var(--s2);color:var(--fg)}.bar button.x:hover{background:var(--danger);color:#fff}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:30px;padding:16px}
/* keys */
.grid{display:grid;grid-template-columns:repeat(4,54px);gap:10px}
.key{height:54px;border-radius:10px;background:var(--s2);border:1px solid #3a3c42;border-bottom-width:4px;transition:background .25s,box-shadow .25s,border-color .25s}
.key.lit{border-color:var(--c);background:color-mix(in srgb,var(--c) 28%,#1a1b1e);box-shadow:0 0 14px var(--c),inset 0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.key.idle{animation:pulse 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*120ms)}
@keyframes pulse{0%,100%{border-color:#3a3c42}50%{border-color:color-mix(in srgb,var(--c) 70%,#3a3c42)}}
/* right column: OLED display */
.right{display:flex;flex-direction:column;align-items:center;gap:18px}
.oled{width:236px;height:120px;background:#05080a;border:3px solid #2a2d33;border-radius:8px;padding:10px 12px;font:14px/1.45 Consolas,'Courier New',monospace;color:#e8f6ff;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 22px #0a1c26,0 0 0 1px #000;white-space:pre;overflow:hidden}
.oled .dim{color:#7fb0c8}
.obar{height:10px;margin-top:4px;border:1px solid #7fb0c8;padding:1px}.obar i{display:block;height:100%;background:#e8f6ff}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
/* bottom bar */
.cta{display:flex;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:#0c0d10;flex:none}
.path{flex:1;font:12px Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.path bdi{direction:ltr}
button.p{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 22px;font:inherit;cursor:pointer}
button.p:hover{filter:brightness(1.12)}button.p:disabled{opacity:.6;cursor:default;filter:none}
button.g{background:none;color:var(--muted);border:0;padding:9px 12px;font:inherit;cursor:pointer}
button.g:hover{color:var(--fg)}button.g:disabled{opacity:.4;cursor:default}
.prog{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.installing .prog{display:block}.installing .path,.installing #change{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar"><span>SnekPad Studio Setup</span>
    <div class="btns"><button id="min" title="Minimize">&#8211;</button><button class="x" id="close" title="Close">&#10005;</button></div></div>
  <div class="stage">
    <div class="grid" id="keys"></div>
    <div class="right">
      <div class="oled" id="oled"></div>
    </div>
  </div>
  <div class="cta">
    <span class="path" id="path"><bdi></bdi></span>
    <div class="prog"><i id="bar"></i></div>
    <button class="g" id="change">Change</button>
    <button class="p" id="go">Install</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const COLORS = ['#ff3b6b','#ff8a3b','#ffd23b','#7dff3b','#3bffa0','#3bd9ff','#3b7dff','#8a3bff','#ff3bf0','#3bffe0','#ffa53b','#5865f2']
const keys = COLORS.map((c, i) => {
  const k = document.createElement('div')
  k.className = 'key idle'
  k.style.setProperty('--c', c)
  k.style.setProperty('--i', i)
  $('keys').appendChild(k)
  return k
})

let dir = '', version = '', state = 'ready'
const STAGES = ['Extracting files', 'Copying resources', 'Writing shortcuts', 'Registering app', 'Finishing up']

function oled(l1, l2, l3) {
  $('oled').innerHTML = `<div>${l1}</div><div class="dim">${l2}</div><div>${l3}</div>`
}
function showReady() {
  oled('SnekPad Studio', 'v' + version, 'Ready<span class="cur">_</span>')
}
function setPath() { $('path').firstElementChild.textContent = dir }

$('min').onclick = () => setup.minimize()
$('close').onclick = () => setup.close()
$('change').onclick = async () => { const d = await setup.chooseDir(dir); if (d) { dir = d; setPath() } }

$('go').onclick = () => {
  if (state === 'done') return setup.launch(dir)
  if (state === 'error') return location.reload()
  state = 'installing'
  $('app').classList.add('installing')
  $('go').disabled = true
  $('go').textContent = 'Installing…'
  keys.forEach((k) => k.classList.remove('idle', 'lit'))
  setup.install(dir)
}

setup.onProgress((p) => {
  $('bar').style.width = p + '%'
  keys.forEach((k, i) => k.classList.toggle('lit', p >= (i + 1) * 8.3))
  oled(`Installing ${p}%`, STAGES[Math.min(4, Math.floor(p / 20))], `<div class="obar"><i style="width:${p}%"></i></div>`)
})

setup.onDone((r) => {
  $('app').classList.remove('installing')
  $('go').disabled = false
  $('bar').style.width = '100%'
  if (r.ok) {
    state = 'done'
    keys.forEach((k) => k.classList.add('lit'))
    oled('Done!', 'SnekPad Studio', 'Open it<span class="cur">_</span>')
    $('go').textContent = 'Launch'
    $('path').firstElementChild.textContent = 'Installed to ' + r.dir
    $('change').style.display = 'none'
    $('path').style.display = 'block'
  } else {
    state = 'error'
    keys.forEach((k) => { k.classList.remove('lit'); k.style.setProperty('--c', '#f23f43') })
    keys.slice(0, 4).forEach((k) => k.classList.add('lit'))
    oled('Install failed', (r.error || 'Unknown error').slice(0, 30), 'Try again<span class="cur">_</span>')
    $('go').textContent = 'Retry'
  }
})

setup.info().then((i) => { dir = i.dir; version = i.version; setPath(); showReady() })
</script>
</body>
</html>
